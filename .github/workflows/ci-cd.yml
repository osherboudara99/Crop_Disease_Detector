name: CI / API CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGION: us-central1
  ARTIFACT_REPOSITORY: crop-disease-predictor-images
  SERVICE: crop-disease-predictor-api

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  python:
    name: Python
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check Python syntax
        run: python -m compileall api modeling

  deploy-api:
    name: Deploy API to Cloud Run
    runs-on: ubuntu-latest
    needs:
      - frontend
      - python
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check GCP deployment configuration
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          missing=()

          if [ -z "${GCP_PROJECT_ID}" ]; then
            missing+=("GCP_PROJECT_ID")
          fi

          if [ -z "${GCP_WORKLOAD_IDENTITY_PROVIDER}" ]; then
            missing+=("GCP_WORKLOAD_IDENTITY_PROVIDER")
          fi

          if [ -z "${GCP_SERVICE_ACCOUNT}" ]; then
            missing+=("GCP_SERVICE_ACCOUNT")
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}"
            printf 'Add them under Settings -> Secrets and variables -> Actions before API deploys can run.\n'
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push API image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${ARTIFACT_REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          BUILD_ID="$(gcloud builds submit \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --region="${REGION}" \
            --config=cloudbuild.yaml \
            --async \
            --format="value(id)" \
            --substitutions="_IMAGE=${IMAGE}" \
            .)"

          printf 'Cloud Build submitted: %s\n' "${BUILD_ID}"

          while true; do
            STATUS="$(gcloud builds describe "${BUILD_ID}" \
              --project="${{ secrets.GCP_PROJECT_ID }}" \
              --region="${REGION}" \
              --format="value(status)")"

            printf 'Cloud Build status: %s\n' "${STATUS}"

            case "${STATUS}" in
              SUCCESS)
                break
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                printf 'Cloud Build failed with status: %s\n' "${STATUS}"
                exit 1
                ;;
            esac

            sleep 10
          done

      - name: Deploy API
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${ARTIFACT_REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          gcloud run deploy "${SERVICE}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --image="${IMAGE}" \
            --region="${REGION}" \
            --allow-unauthenticated \
            --memory=4Gi \
            --cpu=2 \
            --min-instances=0
